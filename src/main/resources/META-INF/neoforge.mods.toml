modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Kris HD"
description = '''
A mod that adds chunk protection that can be stolen by other players.
'''

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "chunkpermits.mixins.json"
